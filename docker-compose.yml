version: '3.8'

services:
  backend:
    build: ./Tarp_Project_Backend
    ports:
      - "9000:9000"
    environment:
      - PORT=9000
      - MONGO_URL=mongodb://mongo:27017/tarp
      - LOGIN_TOKEN=secret_token_change_me
      - LOGIN_EXP_IN_DAYS=1
    depends_on:
      - mongo

  frontend:
    build: ./Tarp_Project_Frontend
    ports:
      - "3001:80"
    depends_on:
      - backend

  mongo:
    image: mongo:4.4
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
